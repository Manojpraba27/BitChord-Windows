name: Build BitChord for Windows
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify executables and create checksums
        shell: pwsh
        run: |
          $names = @('BitChord-Portable.exe', 'BitChord-Setup.exe')
          $lines = foreach ($name in $names) {
            $file = Join-Path 'release' $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1MB) { throw "Missing or incomplete executable: $name" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Windows-x64
          path: |
            desktop/release/BitChord-Setup.exe
            desktop/release/BitChord-Portable.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
