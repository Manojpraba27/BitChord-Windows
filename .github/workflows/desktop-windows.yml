name: Build BitChord for Windows
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Build Windows application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-diagnostics
          path: desktop/windows-build.log

      - name: Windows desktop smoke checks
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/smoke.cjs 2>&1 | Tee-Object -FilePath windows-smoke.log
          $audioResult = $LASTEXITCODE
          node scripts/video-smoke.cjs 2>&1 | Tee-Object -FilePath windows-video-smoke.log
          $videoResult = $LASTEXITCODE
          "Audio/import/close smoke exit code: $audioResult; video/fullscreen smoke exit code: $videoResult" | Set-Content windows-smoke-status.txt
          if ($audioResult -ne 0 -or $videoResult -ne 0) { exit 1 }
      - name: Verify executables and create checksums
        shell: pwsh
        run: |
          $names = @('BitChord-Portable.exe', 'BitChord-Setup.exe')
          $lines = foreach ($name in $names) {
            $file = Join-Path 'release' $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1MB) { throw "Missing or incomplete executable: $name" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Windows-x64
          path: |
            desktop/release/BitChord-Setup.exe
            desktop/release/BitChord-Portable.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish downloadable preview or diagnostics
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $tag = 'library-player-preview'
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target '${{ github.sha }}' --title 'BitChord Library and Player Preview' --prerelease --notes 'Unsigned preview. Native Windows manual acceptance and real provider integrations remain unverified. See source documentation for limitations.'
          }
          foreach ($log in @('windows-smoke.log','windows-video-smoke.log','windows-smoke-status.txt')) { if (Test-Path $log) { gh release upload $tag $log --repo $repo --clobber } }
          if (Test-Path windows-build.log) { gh release upload $tag windows-build.log --repo $repo --clobber }
          if (Test-Path release/SHA256SUMS.txt) {
            gh release upload $tag release/BitChord-Portable.exe release/BitChord-Setup.exe release/SHA256SUMS.txt --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          }
